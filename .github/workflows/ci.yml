name: CI

on:
  push:
    branches:
      - Main
  pull_request:
    branches:
      - Main

jobs:
  validate:
    name: Lint, Typecheck, Server Actions & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint check
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Validate 'use server' exports
        run: npm run check:use-server

      - name: Production Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci
          NEXT_PUBLIC_APP_URL: http://localhost:3000
